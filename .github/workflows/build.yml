name: Build Windows exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --upgrade pip pygame pyinstaller

      - name: Test logic
        run: python test_core.py

      - name: Build exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name petpet --add-data "assets;assets" main.py

      - uses: actions/upload-artifact@v4
        with:
          name: petpet-windows
          path: dist/petpet.exe

      - name: Release (khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/petpet.exe
